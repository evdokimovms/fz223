
version: "1.0"
source: "223-ФЗ"
updated: "2024-12-01"

rules:
  - id: RULE_BRAND_001
    name: manufacturer_without_equivalent
    category: brand
    description: Указан производитель/марка без допуска эквивалента
    trigger:
      all:
        - brand_detected: true
        - equivalent_allowed: false
        - analogs_banned: false
        - false_equivalent: false
    severity: medium
    verdict: violation
    strength: 0.75
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Убрать марку либо добавить «или эквивалент» и описать
      функциональные, технические и качественные характеристики.

  - id: RULE_BRAND_002
    name: manufacturer_analogs_banned
    category: brand
    description: Прямой запрет аналогов/иных марок
    trigger:
      all:
        - brand_detected: true
        - analogs_banned: true
    severity: high
    verdict: violation
    strength: 0.95
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Убрать запрет на аналоги. Допустить эквивалент по функциональным характеристикам.

  - id: RULE_BRAND_003
    name: false_equivalent
    category: brand
    description: >
      Формальный «или эквивалент» при условиях, фактически исключающих аналоги
      (идентичные габариты до мм, полное соответствие без отклонений)
    trigger:
      all:
        - brand_detected: true
        - false_equivalent: true
    severity: high
    verdict: risk
    strength: 0.88
    potential_violation: true
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Оставить «или эквивалент», но убрать условия, делающие эквивалент невозможным
      («до миллиметра», «абсолютно идентичные»). Задать измеримые допуски.

  - id: RULE_BRAND_004
    name: declare_trademark_in_bid
    category: brand
    description: Требование указать товарный знак в заявке (не ограничение)
    trigger:
      all:
        - declare_trademark_only: true
    severity: low
    verdict: ok
    strength: 0.85
    decisive: true
    recommendation: ""

  - id: RULE_ORIGIN_001
    name: origin_exclusion
    category: origin
    description: Исключающее требование к стране происхождения
    trigger:
      all:
        - origin_requirement: true
        - origin_ban: true
    severity: medium
    verdict: violation
    strength: 0.70
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Убрать исключающее требование к стране либо подтвердить нормативным основанием.

  - id: RULE_ORIGIN_002
    name: origin_table_header
    category: origin
    description: Колонка «Страна происхождения» в таблице без запрета
    trigger:
      all:
        - origin_table_only: true
    severity: low
    verdict: ok
    strength: 0.80
    decisive: true
    recommendation: ""

  - id: RULE_STD_001
    name: plant_tu_without_specs
    category: standards
    description: ТУ конкретного завода без характеристик и без эквивалента
    trigger:
      all:
        - tu_plant: true
        - no_characteristics: true
        - no_equivalent: true
    severity: medium
    verdict: violation
    strength: 0.85
    law_refs:
      - law: "223-ФЗ"
        article: "4"
        part: "10"
        point: "1"
    recommendation: >
      Заменить ТУ завода на ГОСТ или функциональные характеристики, допустить эквивалент.

  - id: RULE_EXCL_001
    name: sole_supplier_phrase
    category: exclusive
    description: Формулировка единственного поставщика/производителя
    trigger:
      all:
        - exclusive_phrase: true
    severity: high
    verdict: violation
    strength: 0.85
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Убрать закрепление единственного поставщика, допустить эквивалентные решения.

  - id: RULE_PART_001
    name: territorial_experience
    category: participants
    description: Опыт, привязанный к региону/городу
    trigger:
      all:
        - territorial_experience: true
    severity: high
    verdict: violation
    strength: 0.80
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Убрать территориальную привязку опыта либо обосновать спецификой объекта.

  - id: RULE_PART_002
    name: manufacturer_cert_or_dealer
    category: participants
    description: Сертификат/авторизация конкретного производителя или статус дилера
    trigger:
      any:
        - manufacturer_cert: true
        - official_dealer: true
    severity: high
    verdict: risk
    strength: 0.75
    law_refs:
      - law: "223-ФЗ"
        article: "3"
        part: "6.1"
    recommendation: >
      Обосновать требование гарантийным обслуживанием / безопасностью либо смягчить.


  - id: RULE_BRAND_NEG_001
    name: participant_requisites_not_brand
    category: brand
    description: Фирменное наименование / реквизиты участника — не ограничение по товару
    trigger:
      all:
        brand_detected: false
        declare_trademark_only: true
    severity: low
    verdict: ok
    strength: 0.9
    decisive: true
    recommendation: ""
